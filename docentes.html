<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="JS/ui.js" defer></script>
    <script src="JS/storage.js" defer></script>
    <script src="JS/docentes.js" defer></script>
    <title>Gestión docentes</title>
</head>
<body>
    <header>
    <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html">Alumnos</a>
            <a href="docentes.html">Docentes</a>
    </nav>
    </header>


    <main>
      <h1>Gestión de docentes</h1>
      <section class="formulario-container">
       <h2>Alta de docentes</h2>

     <form id="formulario">
      <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre">
      </div>
       
      <div class="campo">
      <label for="especialidad">Especialidad</label>
      <input type="text" id="especialidad">
       </div>

      <div class="campo">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo">
      </div>

      <button type="submit">Guardar</button>
        
     </form>
     </section>

     <section class="lista-container">
                <h2>Docentes registrados</h2>
                <p id="cantidadDocentes"></p>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Especialidad</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaDocentes"></tbody>
                </table>
            </section>

            <div id="mensaje" class="mensaje"></div>
    </main>
 
  
</body>
</html>
